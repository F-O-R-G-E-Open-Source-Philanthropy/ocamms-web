    <script>
        // ================================================================
        //  INDEXEDDB HELPERS
        // ================================================================
        const DB_NAME = 'OccamsWebSession';
        const STORE_NAME = 'matrixProjects';
        const DB_VERSION = 2; // Upgraded for multi-project support

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveProject(projectName, data) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put({ id: projectName, updatedAt: Date.now(), ...data });
                await new Promise((resolve, reject) => {
                    tx.oncomplete = resolve;
                    tx.onerror = reject;
                });
                return true;
            } catch (err) {
                console.error('Save error:', err);
                return false;
            }
        }

        async function loadProject(projectName) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                return await new Promise((resolve, reject) => {
                    const req = store.get(projectName);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            } catch (err) {
                console.error('Load error:', err);
                return null;
            }
        }
        
        async function getAllProjects() {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                return await new Promise((resolve, reject) => {
                    const req = store.getAllKeys();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            } catch (err) {
                console.error('Get all error:', err);
                return [];
            }
        }

        async function deleteProjectFromDB(projectName) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.delete(projectName);
                await new Promise((resolve, reject) => {
                    tx.oncomplete = resolve;
                    tx.onerror = reject;
                });
                return true;
            } catch (err) {
                console.error('Delete error:', err);
                return false;
            }
        }

        // ================================================================
        //  STATE
        // ================================================================
        const state = {
            currentProject: 'Untitled',
            nodes: {},
            edges: [],
            structuralEdges: [], // Separates asset loads from logic flow to prevent false cyclic alerts
            inferredPaths: {},
            pan: { x: 0, y: 0 },
            zoom: 1,
            isDraggingCanvas: false,
            draggedNode: null,
            lastMouse: { x: 0, y: 0 },
            filesProcessed: 0,
            pickMode: 'files',
            processedFiles: new Set()
        };

        // ================================================================
        //  PLUGIN API & LOADER
        // ================================================================
        window.OccamsAPI = {
            state: state,
            hooks: {
                afterEdgesDrawn: [],
                onFileParse: [] // NEW: Middleware hook to allow plugins to scan raw file content before matrix generation
            },
            addNode: function(id, type, iconText, vars, deps, dirPath) { 
                addNodeData(id, type, iconText, vars, deps, dirPath); 
            },
            showToast: function(msg) { showToast(msg); }
        };

        // --- CENTRALIZED PLUGIN DIRECTORY ---
        // Simply add your extension URLs or local paths to this array.
        const PLUGINS = [
            'https://raw.githubusercontent.com/F-O-R-G-E-Open-Source-Philanthropy/ocamms-web/refs/heads/main/plugins/cyclic-alerts.js',
            'plugins/cloud-db-detector.js' // Placeholder for the new Cloud Database Extension
        ];

        async function loadPlugins() {
            for (let path of PLUGINS) {
                try {
                    // 1. Fetch the raw code (bypasses standard script-tag blocking)
                    const response = await fetch(path);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const code = await response.text();
                    
                    // 2. Convert to a local Blob to bypass strict Content Security Policies (CSP)
                    const blob = new Blob([code], { type: 'application/javascript' });
                    const blobUrl = URL.createObjectURL(blob);
                    
                    // 3. Inject the local blob URL securely
                    const script = document.createElement('script');
                    script.src = blobUrl;
                    script.onload = () => {
                        URL.revokeObjectURL(blobUrl); // Memory cleanup
                        const pluginName = path.split('/').pop();
                        showToast(`🔌 Plugin Active: ${pluginName}`);
                    };
                    document.body.appendChild(script);
                } catch (error) {
                    console.warn(`Failed to load plugin: ${path}`, error);
                    // Silent fail for placeholders
                }
            }
        }

        // ================================================================
        //  DOM REFS
        // ================================================================
        const el = {
            workspace: document.getElementById('workspace'),
            canvas: document.getElementById('canvas'),
            folders: document.getElementById('folders'),
            edges: document.getElementById('edges'),
            nodes: document.getElementById('nodes'),
            dropZone: document.getElementById('drop-zone'),
            fileInput: document.getElementById('file-input'),
            folderInput: document.getElementById('folder-input'),
            browseAction: document.getElementById('browse-action'),
            modeFiles: document.getElementById('modeFiles'),
            modeFolders: document.getElementById('modeFolders'),
            fileList: document.getElementById('file-list'),
            fileCount: document.getElementById('file-count'),
            notifArea: document.getElementById('notif-area'),
            saveSessionBtn: document.getElementById('saveSessionBtn'),
            loadSessionBtn: document.getElementById('loadSessionBtn'),
            clearSessionBtn: document.getElementById('clearSessionBtn')
        };

        // ================================================================
        //  HELPERS
        // ================================================================
        const exts = {
            js: { text: 'Js', type: 'js' },
            ts: { text: 'Ts', type: 'ts' },
            jsx: { text: 'Rx', type: 'js' },
            tsx: { text: 'Tx', type: 'ts' },
            cs: { text: '#', type: 'cs' },
            cpp: { text: '++', type: 'cpp' },
            c: { text: 'C', type: 'cpp' },
            h: { text: 'H', type: 'cpp' },
            hpp: { text: 'Hp', type: 'cpp' },
            py: { text: 'Py', type: 'py' },
            rb: { text: 'Rb', type: 'rb' },
            php: { text: 'Ph', type: 'php' },
            html: { text: '<>', type: 'html' },
            htm: { text: '<>', type: 'html' },
            css: { text: '{}', type: 'css' },
            scss: { text: 'Sc', type: 'css' },
            sass: { text: 'Sa', type: 'css' },
            less: { text: 'Le', type: 'css' },
            go: { text: 'Go', type: 'go' },
            rs: { text: 'Rs', type: 'rs' },
            swift: { text: 'Sw', type: 'swift' },
            kt: { text: 'Kt', type: 'kt' },
            java: { text: 'Ja', type: 'java' },
            sh: { text: 'Sh', type: 'sh' },
            json: { text: '{}', type: 'json' },
            xml: { text: 'Xm', type: 'xml' },
            yaml: { text: 'Ya', type: 'yaml' },
            yml: { text: 'Ym', type: 'yaml' },
            md: { text: 'Md', type: 'md' },
            txt: { text: 'Tt', type: 'txt' }
        };

        // Extended file extension to language type mapping for parser
        const langTypes = {
            js: 'js',
            ts: 'ts',
            jsx: 'js',
            tsx: 'ts',
            cs: 'cs',
            cpp: 'cpp',
            c: 'cpp',
            h: 'cpp',
            hpp: 'cpp',
            py: 'py',
            rb: 'rb',
            php: 'php',
            go: 'go',
            rs: 'rs',
            swift: 'swift',
            kt: 'kt',
            java: 'java',
            sh: 'sh'
        };

        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const h = Math.abs(hash) % 360;
            return `hsl(${h}, 65%, 55%)`;
        }

        // ================================================================
        //  TOAST
        // ================================================================
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML =
                `<i class="fa-solid fa-circle-info" style="color:var(--accent-orange); margin-right:8px;"></i> ${msg}`;
            el.notifArea.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        // ================================================================
        //  MODE TOGGLE
        // ================================================================
        function setPickMode(mode) {
            state.pickMode = mode;
            el.modeFiles.classList.toggle('active', mode === 'files');
            el.modeFolders.classList.toggle('active', mode === 'folders');
            el.browseAction.textContent = mode === 'files' ? 'Browse Files' : 'Browse Folder';
        }

        el.modeFiles.addEventListener('click', (e) => {
            e.stopPropagation();
            setPickMode('files');
        });
        el.modeFolders.addEventListener('click', (e) => {
            e.stopPropagation();
            setPickMode('folders');
        });

        el.browseAction.addEventListener('click', (e) => {
            e.stopPropagation();
            if (state.pickMode === 'files') {
                el.fileInput.click();
            } else {
                el.folderInput.click();
            }
        });

        el.dropZone.addEventListener('click', (e) => {
            const tag = e.target.tagName;
            if (tag === 'BUTTON' || tag === 'SPAN' || e.target.closest('.mode-toggle') || e.target.closest(
                    '.browse-links')) {
                return;
            }
            if (state.pickMode === 'files') {
                el.fileInput.click();
            } else {
                el.folderInput.click();
            }
        });

        // ================================================================
        //  DRAG & DROP
        // ================================================================
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        function initDragAndDrop() {
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
                el.dropZone.addEventListener(ev, preventDefaults, false);
                document.body.addEventListener(ev, preventDefaults, false);
            });
            ['dragenter', 'dragover'].forEach(ev => {
                el.dropZone.addEventListener(ev, () => el.dropZone.classList.add('dragover'), false);
            });
            ['dragleave', 'drop'].forEach(ev => {
                el.dropZone.addEventListener(ev, () => el.dropZone.classList.remove('dragover'), false);
            });
            el.dropZone.addEventListener('drop', handleDrop, false);
        }

        function handleDrop(e) {
            const dt = e.dataTransfer;
            if (dt.items) {
                for (let i = 0; i < dt.items.length; i++) {
                    if (dt.items[i].kind === 'file') {
                        const entry = dt.items[i].webkitGetAsEntry();
                        if (entry) traverseFileTree(entry);
                    }
                }
            } else {
                handleFiles(dt.files);
            }
        }

        function traverseFileTree(item, path = '') {
            if (item.isFile) {
                item.file(file => {
                    file.customPath = path + file.name;
                    handleFiles([file]);
                });
            } else if (item.isDirectory) {
                const reader = item.createReader();
                reader.readEntries(entries => {
                    for (let i = 0; i < entries.length; i++) {
                        traverseFileTree(entries[i], path + item.name + '/');
                    }
                });
            }
        }

        // ================================================================
        //  FILE INPUT HANDLERS
        // ================================================================
        el.fileInput.addEventListener('change', function() {
            handleFiles(this.files);
            this.value = '';
        });

        el.folderInput.addEventListener('change', function() {
            handleFiles(this.files);
            this.value = '';
        });

        // ================================================================
        //  ENHANCED PARSER — supports many languages and import patterns
        // ================================================================
        function extractDependencies(content, fileExt) {
            const deps = new Map(); // Use Map to prevent duplicates and handle upgrades

            // Helper to add dependencies and flag them intelligently
            const addDep = (depString, isStructural) => {
                let norm = depString.replace(/\\/g, '/').replace(/^\.\.?\//, '');
                const parts = norm.split('/');
                const depFile = parts.pop();

                // Only keep valid file names
                if (depFile && depFile.includes('.') && depFile.length > 2) {
                    if (deps.has(depFile)) {
                        // If we previously marked this as a loose structural load, 
                        // but later find a strict hard import, upgrade its status to false (Logic plane)
                        if (!isStructural && deps.get(depFile).isStructural) {
                            deps.get(depFile).isStructural = false;
                        }
                    } else {
                        deps.set(depFile, { file: depFile, isStructural, parts });
                    }
                }
            };

            const lang = langTypes[fileExt] || 'js';

            // --- 1. HARD PATTERNS (Logic Plane: Can cause infinite execution cycles) ---
            const hardPatterns = [];
            if (lang === 'js' || lang === 'ts') {
                hardPatterns.push(/import\s*\{[^}]*\}\s*from\s*['"`]([^'"`]+)['"`]/g);
                hardPatterns.push(/import\s*[\w\s,]+\s*from\s*['"`]([^'"`]+)['"`]/g);
                hardPatterns.push(/import\s*['"`]([^'"`]+)['"`]/g);
                hardPatterns.push(/import\(\s*['"`]([^'"`]+)['"`]\s*\)/g);
                hardPatterns.push(/require\(\s*['"`]([^'"`]+)['"`]\s*\)/g);
            } else if (lang === 'cs' || lang === 'cpp') {
                hardPatterns.push(/#include\s*["<]([^">]+)[">]/g);
                hardPatterns.push(/using\s+([\w\.]+);/g);
            } else if (lang === 'py') {
                hardPatterns.push(/import\s+([\w\.]+)/g);
                hardPatterns.push(/from\s+([\w\.]+)\s+import/g);
            } else if (lang === 'rb') {
                hardPatterns.push(/require\s+['"]([^'"]+)['"]/g);
                hardPatterns.push(/require_relative\s+['"]([^'"]+)['"]/g);
            } else if (lang === 'php') {
                hardPatterns.push(/require\s+['"]([^'"]+)['"]/g);
                hardPatterns.push(/require\s+["]([^"]+)["]/g);
                hardPatterns.push(/include\s+['"]([^'"]+)['"]/g);
                hardPatterns.push(/include\s+["]([^"]+)["]/g);
                hardPatterns.push(/use\s+([\w\\]+)/g);
            } else if (lang === 'go') {
                hardPatterns.push(/import\s+["]([^"]+)["]/g);
                hardPatterns.push(/import\s*\(\s*["]([^"]+)["]/g);
            } else if (lang === 'rs') {
                hardPatterns.push(/use\s+([\w:]+)/g);
                hardPatterns.push(/extern\s+crate\s+([\w]+)/g);
            } else if (lang === 'swift') {
                hardPatterns.push(/import\s+([\w]+)/g);
            } else if (lang === 'kt') {
                hardPatterns.push(/import\s+([\w\.]+)/g);
            } else if (lang === 'java') {
                hardPatterns.push(/import\s+([\w\.]+);/g);
            } else if (lang === 'sh') {
                hardPatterns.push(/source\s+([\w\/\.]+)/g);
            }

            // --- 2. LOOSE PATTERNS (Structural Plane: Safe architecture configs, e.g., Electron) ---
            const loosePatterns = [];
            // HTML assets
            loosePatterns.push(/(?:src|href)=['"]([^'"]+\.[a-zA-Z0-9]+)['"]/g);
            // Electron specific & general asset loading
            loosePatterns.push(/(?:preload|loadURL|loadFile).*?['"`]([^'"`]+)['"`]/g);
            // Universal fallback for config files (like package.json) capturing random paths
            loosePatterns.push(/['"`]([^'"`]*\.[a-zA-Z0-9]+)['"`]/g);

            // Execute Hard
            hardPatterns.forEach(regex => {
                regex.lastIndex = 0;
                let match;
                while ((match = regex.exec(content)) !== null) {
                    if (match[1]) addDep(match[1].trim(), false);
                }
            });

            // Execute Loose (Structural)
            loosePatterns.forEach(regex => {
                regex.lastIndex = 0;
                let match;
                while ((match = regex.exec(content)) !== null) {
                    if (match[1]) addDep(match[1].trim(), true);
                }
            });

            return Array.from(deps.values());
        }

        // ================================================================
        //  FILE PROCESSING — UPGRADED PARSER
        // ================================================================
        function handleFiles(files) {
            [...files].forEach(file => {
                const fileKey = file.name + (file.customPath || file.webkitRelativePath || '');
                if (state.processedFiles.has(fileKey)) return;
                state.processedFiles.add(fileKey);

                const extMatch = file.name.match(/\.([^.]+)$/);
                const ext = extMatch ? extMatch[1].toLowerCase() : 'txt';
                const reader = new FileReader();
                reader.onload = (e) => {
                    const content = e.target.result;
                    processFileData(file, ext, content, file.size);
                };
                const blob = file.slice(0, 30000);
                reader.readAsText(blob);
            });
        }

        function processFileData(fileObj, ext, content, size) {
            const fileName = fileObj.name;
            const physicalPath = fileObj.customPath || fileObj.webkitRelativePath || '';

            if (state.nodes[fileName]) {
                showToast(`Updated mapping for ${fileName}`);
                return;
            }

            const typeInfo = exts[ext] || { text: '?', type: 'txt' };
            const nodeType = typeInfo.type;

            let vars = [];
            let deps = [];

            // --- Determine folder path: INFERRED takes priority ---
            let dirPath = '';
            if (state.inferredPaths[fileName]) {
                dirPath = state.inferredPaths[fileName];
            } else if (physicalPath) {
                const parts = physicalPath.split('/');
                parts.pop();
                dirPath = parts.join('/');
            }

            // --- Extract dependencies using the enhanced parser ---
            const rawDeps = extractDependencies(content, ext);
            rawDeps.forEach(depObj => {
                const depFile = depObj.file;
                deps.push({ target: depFile, isStructural: depObj.isStructural });
                
                // Store inferred path for the dependency
                if (depObj.parts.length > 0) {
                    const inferredDir = depObj.parts.join('/');
                    if (!state.inferredPaths[depFile] ||
                        inferredDir.split('/').length > (state.inferredPaths[depFile]?.split('/').length || 0)) {
                        state.inferredPaths[depFile] = inferredDir;
                    }
                }
            });

            // Limit deps to 8
            if (deps.length > 8) deps = deps.slice(0, 8);

            // --- Extract variables (language agnostic) ---
            const varMatches = content.matchAll(/(?:function|class|const|let|var|public|private|def|fun|fn|func)\s+([a-zA-Z0-9_]+)/g);
            for (const m of varMatches) {
                if (vars.length < 8 && m[1].length > 2) vars.push(m[1]);
            }
            if (vars.length === 0) vars = ['Initialization', 'Config Data'];

            // --- Database detection (Databases are structurally safe, not execution loops) ---
            let dbDetected = false;
            const dbRegex1 = /(?:window\.)?indexedDB\.open\(\s*(['"`])([^'"`]+)\1/g;
            let m1;
            while ((m1 = dbRegex1.exec(content)) !== null) {
                const dbName = m1[2];
                const dbId = `IndexedDB - ${dbName}`;
                deps.push({ target: dbId, isStructural: true });
                if (!state.nodes[dbId]) addNodeData(dbId, 'db', '', [], [], '');
                dbDetected = true;
            }
            const dbRegex2 = /localStorage\.(?:setItem|getItem)\(\s*(['"`])([^'"`]+)\1/g;
            let m2;
            while ((m2 = dbRegex2.exec(content)) !== null) {
                const lsId = 'LocalStorage';
                deps.push({ target: lsId, isStructural: true });
                if (!state.nodes[lsId]) addNodeData(lsId, 'db', '', [], [], '');
            }
            if (!dbDetected && /indexedDB/i.test(content)) {
                const genericId = 'IndexedDB - Generic';
                deps.push({ target: genericId, isStructural: true });
                if (!state.nodes[genericId]) addNodeData(genericId, 'db', '', [], [], '');
            }

            // --- TRIGGER PLUGIN PARSER HOOKS ---
            window.OccamsAPI.hooks.onFileParse.forEach(fn => {
                fn({ fileName, ext, content, deps, vars, dirPath });
            });

            if (deps.length === 0 && Object.keys(state.nodes).length > 0) {
                const keys = Object.keys(state.nodes).filter(k => state.nodes[k].type !== 'db' && state.nodes[k].type !== 'db-cloud');
                if (keys.length > 0) {
                    deps.push({ target: keys[Math.floor(Math.random() * keys.length)], isStructural: true });
                }
            }

            addNodeData(fileName, nodeType, typeInfo.text, vars, deps, dirPath);
            addFileToTray(fileName, typeInfo.text, size);

            state.filesProcessed++;
            el.fileCount.innerText = state.filesProcessed;
            const dirDisplay = dirPath || 'root';
            showToast(`🔗 ${fileName} → ${dirDisplay} (${deps.length} deps)`);
        }

        // ================================================================
        //  NODE GRAPH
        // ================================================================
        function addNodeData(id, type, iconText, vars = [], deps = [], dirPath = '') {
            const count = Object.keys(state.nodes).length;
            const angle = count * 0.8;
            const radius = 150 + count * 20;

            const cx = el.workspace.clientWidth / 2 - 130;
            const cy = el.workspace.clientHeight / 2 - 50;

            const x = (cx - state.pan.x) / state.zoom + Math.cos(angle) * radius;
            const y = (cy - state.pan.y) / state.zoom + Math.sin(angle) * radius;

            state.nodes[id] = { id, type, iconText, vars, deps, dirPath, x, y, expanded: true };

            const nodeEl = createNodeElement(state.nodes[id]);
            el.nodes.appendChild(nodeEl);

            deps.forEach(depObj => {
                // Backward compatibility if array contains strings vs objects
                const tgt = typeof depObj === 'string' ? depObj : depObj.target;
                const isStruct = typeof depObj === 'string' ? false : depObj.isStructural;

                if (isStruct) {
                    const exists = state.structuralEdges.some(e => e.source === id && e.target === tgt);
                    if (!exists) state.structuralEdges.push({ source: id, target: tgt });
                } else {
                    const exists = state.edges.some(e => e.source === id && e.target === tgt);
                    if (!exists) state.edges.push({ source: id, target: tgt });
                }
            });

            requestAnimationFrame(updateAllVisuals);
        }

        function createNodeElement(n) {
            const elNode = document.createElement('div');
            elNode.id = `node-${n.id}`;
            elNode.style.left = `${n.x}px`;
            elNode.style.top = `${n.y}px`;

            if (n.type === 'db' || n.type === 'db-cloud') {
                elNode.className = 'node db-node';
                elNode.setAttribute('data-type', n.type);
                elNode.onmousedown = (e) => startNodeDrag(e, n.id);
                
                const cloudBadgeHtml = n.type === 'db-cloud' ? `<i class="fa-solid fa-cloud cloud-badge"></i>` : '';
                
                elNode.innerHTML = `
                    <div style="position:relative; display:inline-block;">
                        <i class="fa-solid fa-database db-icon"></i>
                        ${cloudBadgeHtml}
                    </div>
                    <div class="db-title">${n.id}</div>
                `;
                return elNode;
            }

            elNode.className = 'node expanded';
            elNode.setAttribute('data-type', n.type);

            const folderColor = n.dirPath ? stringToColor(n.dirPath) : 'transparent';

            let badgeHtml = '';
            if (n.dirPath) {
                const shortName = n.dirPath.split('/').pop() || n.dirPath;
                badgeHtml =
                    `<span class="node-folder-badge" title="${n.dirPath}"><i class="fa-regular fa-folder"></i> ${shortName}</span>`;
            } else {
                badgeHtml =
                    `<span class="node-folder-badge" style="opacity:0.4;"><i class="fa-regular fa-folder"></i> root</span>`;
            }

            const varsHtml = [...new Set(n.vars)].map(v =>
                `<li class="variable-item"><i class="fa-solid fa-caret-right"></i> ${v}</li>`
            ).join('') || '<li class="variable-item" style="color:var(--text-muted)">No exports</li>';

            elNode.innerHTML = `
                <div class="node-folder-accent" style="background:${folderColor};"></div>
                <div class="node-header" onmousedown="startNodeDrag(event, '${n.id}')">
                    <div class="doc-icon-wrapper" style="margin-right:8px; width:22px; height:28px; flex-shrink:0;">
                        <i class="fa-regular fa-file doc-icon-bg" style="font-size:22px;"></i>
                        <span class="doc-icon-text" style="font-size:8px;">${n.iconText}</span>
                    </div>
                    <div class="node-title" title="${n.id}">${n.id}</div>
                    ${badgeHtml}
                    <div class="node-toggle" onclick="toggleNode('${n.id}', event)">
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>
                <div class="node-content">
                    <ul class="variable-list">${varsHtml}</ul>
                </div>
            `;
            return elNode;
        }

        window.toggleNode = function(id, event) {
            if (event) event.stopPropagation();
            const node = state.nodes[id];
            if (!node || node.type === 'db' || node.type === 'db-cloud') return;
            node.expanded = !node.expanded;
            const elNode = document.getElementById(`node-${id}`);
            if (elNode) elNode.classList.toggle('expanded', node.expanded);
            setTimeout(updateAllVisuals, 300);
        };

        // ================================================================
        //  TRAY
        // ================================================================
        function addFileToTray(name, iconText, size) {
            const kb = (size / 1024).toFixed(1);
            const elItem = document.createElement('div');
            elItem.className = 'file-item';
            elItem.id = `tray-${name}`;
            const dirInfo = state.nodes[name]?.dirPath || '';
            elItem.innerHTML = `
                <div class="doc-icon-wrapper">
                    <i class="fa-regular fa-file doc-icon-bg"></i>
                    <span class="doc-icon-text">${iconText}</span>
                </div>
                <div class="file-info">
                    <div class="file-name" title="${name}">${name}</div>
                    <div class="file-meta" style="display:flex; align-items:center;">
                        ${kb} KB • <input type="text" class="path-input" value="${dirInfo}" placeholder="root" title="Edit folder path (e.g. src/newFolder)">
                    </div>
                </div>
                <div class="file-actions">
                    <button class="btn-delete" title="Remove" onclick="removeScript('${name}', event)">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `;

            // Handle Path Input changes
            const pathInput = elItem.querySelector('.path-input');
            pathInput.onclick = (e) => e.stopPropagation(); // Prevent panning to node
            pathInput.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    pathInput.blur();
                }
            };
            pathInput.onblur = (e) => {
                let newPath = e.target.value.trim();
                newPath = newPath.replace(/\/+$/, ''); // Strip trailing slashes
                
                if (state.nodes[name] && state.nodes[name].dirPath !== newPath) {
                    state.nodes[name].dirPath = newPath;
                    
                    // Update node badge visually immediately
                    const nodeEl = document.getElementById(`node-${name}`);
                    if (nodeEl) {
                        const badge = nodeEl.querySelector('.node-folder-badge');
                        if (badge) {
                            if (newPath) {
                                const shortName = newPath.split('/').pop();
                                badge.innerHTML = `<i class="fa-regular fa-folder"></i> ${shortName}`;
                                badge.title = newPath;
                                badge.style.opacity = '1';
                            } else {
                                badge.innerHTML = `<i class="fa-regular fa-folder"></i> root`;
                                badge.style.opacity = '0.4';
                            }
                        }
                    }
                    updateAllVisuals();
                    if(typeof autoSave === 'function') autoSave();
                    showToast(`Moved ${name} to ${newPath || 'root'}`);
                }
            };

            elItem.onclick = () => {
                const node = state.nodes[name];
                if (node) {
                    state.pan.x = -node.x * state.zoom + (el.workspace.clientWidth / 2) - 130;
                    state.pan.y = -node.y * state.zoom + (el.workspace.clientHeight / 2) - 50;
                    updateCanvasTransform();
                    const nEl = document.getElementById(`node-${name}`);
                    if (nEl) {
                        nEl.style.boxShadow = '0 0 30px var(--text-ruby)';
                        setTimeout(() => nEl.style.boxShadow = '', 1000);
                    }
                }
            };
            el.fileList.prepend(elItem);
        }

        window.removeScript = function(name, event) {
            event.stopPropagation();
            delete state.nodes[name];
            state.edges = state.edges.filter(e => e.source !== name && e.target !== name);
            state.structuralEdges = state.structuralEdges.filter(e => e.source !== name && e.target !== name);

            const nodeEl = document.getElementById(`node-${name}`);
            if (nodeEl) nodeEl.remove();

            const trayEl = document.getElementById(`tray-${name}`);
            if (trayEl) trayEl.remove();

            state.filesProcessed = Math.max(0, state.filesProcessed - 1);
            el.fileCount.innerText = state.filesProcessed;

            cleanupOrphanedDBs();
            updateAllVisuals();
            showToast(`De-referenced ${name} from matrix.`);
        };

        function cleanupOrphanedDBs() {
            Object.keys(state.nodes).forEach(id => {
                const node = state.nodes[id];
                if (node.type === 'db' || node.type === 'db-cloud') {
                    const hasConnection = state.edges.some(e => e.source === id || e.target === id) || 
                                          state.structuralEdges.some(e => e.source === id || e.target === id);
                    if (!hasConnection) {
                        delete state.nodes[id];
                        const elNode = document.getElementById(`node-${id}`);
                        if (elNode) elNode.remove();
                        showToast(`Swept orphaned DB: ${id}`);
                    }
                }
            });
        }

        // ================================================================
        //  RENDER: EDGES + FOLDERS
        // ================================================================
        function updateAllVisuals() {
            updateEdges();
            updateFolders();
        }

        function updateEdges() {
            const existingPaths = el.edges.querySelectorAll('path');
            existingPaths.forEach(p => p.remove());

            const cRect = el.canvas.getBoundingClientRect();

            // Combine logic edges and structural edges for rendering
            const allEdgesToDraw = [
                ...state.edges.map(e => ({ ...e, isStructural: false })),
                ...state.structuralEdges.map(e => ({ ...e, isStructural: true }))
            ];

            allEdgesToDraw.forEach(edge => {
                const nSrc = state.nodes[edge.source];
                const nTgt = state.nodes[edge.target];
                if (!nSrc || !nTgt) return;

                const elS = document.getElementById(`node-${edge.source}`);
                const elT = document.getElementById(`node-${edge.target}`);
                if (!elS || !elT) return;

                const sRect = elS.getBoundingClientRect();
                const tRect = elT.getBoundingClientRect();

                let sx = (sRect.left - cRect.left + sRect.width / 2) / state.zoom;
                let sy = (sRect.top - cRect.top + sRect.height / 2) / state.zoom;
                let tx = (tRect.left - cRect.left + tRect.width / 2) / state.zoom;
                let ty = (tRect.top - cRect.top + tRect.height / 2) / state.zoom;

                const dist = Math.hypot(tx - sx, ty - sy);
                const cp = Math.max(dist * 0.4, 50);
                let d;
                if (Math.abs(sx - tx) > Math.abs(sy - ty)) {
                    d = `M ${sx} ${sy} C ${sx + cp} ${sy}, ${tx - cp} ${ty}, ${tx} ${ty}`;
                } else {
                    d = `M ${sx} ${sy} C ${sx} ${sy + cp}, ${tx} ${ty - cp}, ${tx} ${ty}`;
                }

                const g = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                g.setAttribute('d', d);
                g.setAttribute('class', edge.isStructural ? 'edge-glow structural' : 'edge-glow');
                el.edges.appendChild(g);

                const b = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                b.setAttribute('d', d);
                b.setAttribute('class', edge.isStructural ? 'edge-line structural' : 'edge-line');
                el.edges.appendChild(b);

                const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                p.setAttribute('d', d);
                p.setAttribute('class', edge.isStructural ? 'edge-packet structural' : 'edge-packet');
                
                // Only plugin target hard execution logic edges for cyclic tracking
                if (!edge.isStructural) {
                    p.setAttribute('data-source', edge.source);
                    p.setAttribute('data-target', edge.target);
                    p.setAttribute('marker-end', 'url(#arrowhead)');
                } else {
                    // Structural edges still get an arrow, but without the cyclic target data
                    p.setAttribute('marker-end', 'url(#arrowhead)');
                }
                
                el.edges.appendChild(p);
            });

            // Fire plugin hooks after rendering
            window.OccamsAPI.hooks.afterEdgesDrawn.forEach(fn => fn(el.edges));
        }

        // ================================================================
        //  FOLDER AABB — WITH 15px GAP AND CHILD-OVER-PARENT Z-INDEX
        // ================================================================
        function updateFolders() {
            // 1. Group nodes by directory path
            const dirs = {};
            Object.values(state.nodes).forEach(n => {
                if (n.dirPath && n.type !== 'db' && n.type !== 'db-cloud') {
                    const parts = n.dirPath.split('/');
                    let current = '';
                    parts.forEach(part => {
                        current = current ? `${current}/${part}` : part;
                        if (!dirs[current]) dirs[current] = [];
                        dirs[current].push(n.id);
                    });
                }
            });

            const activeDirs = new Set(Object.keys(dirs));
            Array.from(el.folders.children).forEach(child => {
                const dirId = child.getAttribute('data-dir');
                if (!activeDirs.has(dirId)) child.remove();
            });

            // Compute max depth
            let maxDepth = 0;
            Object.keys(dirs).forEach(dir => {
                const d = dir.split('/').length;
                if (d > maxDepth) maxDepth = d;
            });

            const depthMap = {};
            Object.keys(dirs).forEach(dir => {
                depthMap[dir] = dir.split('/').length;
            });

            // Compute bounding boxes
            const folderBounds = {};
            Object.keys(dirs).forEach(dir => {
                let minX = Infinity,
                    minY = Infinity,
                    maxX = -Infinity,
                    maxY = -Infinity;
                let valid = false;

                dirs[dir].forEach(nodeId => {
                    const nodeEl = document.getElementById(`node-${nodeId}`);
                    if (nodeEl) {
                        const n = state.nodes[nodeId];
                        const h = nodeEl.offsetHeight || 150;
                        const w = nodeEl.offsetWidth || 260;
                        if (n.x < minX) minX = n.x;
                        if (n.y < minY) minY = n.y;
                        if (n.x + w > maxX) maxX = n.x + w;
                        if (n.y + h > maxY) maxY = n.y + h;
                        valid = true;
                    }
                });

                if (valid) {
                    folderBounds[dir] = { minX, minY, maxX, maxY };
                }
            });

            // --- PADDING: BASE = 30px, extra 25px per depth level above current ---
            const BASE_PAD = 30;
            const EXTRA_PER_LEVEL = 25;

            const folderPadding = {};
            Object.keys(dirs).forEach(dir => {
                const depth = depthMap[dir] || 1;
                const pad = BASE_PAD + (maxDepth - depth) * EXTRA_PER_LEVEL;
                folderPadding[dir] = pad;
            });

            // Enforce parent > child padding (at least 25px difference)
            let changed = true;
            let iterations = 0;
            const MAX_ITER = 20;
            while (changed && iterations < MAX_ITER) {
                changed = false;
                iterations++;
                Object.keys(dirs).forEach(dir => {
                    const children = [];
                    Object.keys(dirs).forEach(other => {
                        if (other !== dir && other.startsWith(dir + '/')) {
                            children.push(other);
                        }
                    });
                    if (children.length === 0) return;
                    let maxChildPad = 0;
                    children.forEach(child => {
                        if (folderPadding[child] > maxChildPad) maxChildPad = folderPadding[child];
                    });
                    const requiredPad = maxChildPad + 25;
                    if (folderPadding[dir] < requiredPad) {
                        folderPadding[dir] = requiredPad;
                        changed = true;
                    }
                });
            }

            // Render each folder box
            Object.keys(dirs).forEach(dir => {
                const bounds = folderBounds[dir];
                if (!bounds) return;

                const pad = folderPadding[dir] || BASE_PAD;
                const topPad = pad + 28;

                const safeId = 'folder-' + btoa(dir).replace(/[^a-zA-Z0-9]/g, '');
                let box = document.getElementById(safeId);
                if (!box) {
                    box = document.createElement('div');
                    box.id = safeId;
                    box.setAttribute('data-dir', dir);
                    box.className = 'folder-box';
                    const folderName = dir.split('/').pop();
                    box.innerHTML =
                        `<div class="folder-label"><i class="fa-solid fa-folder"></i> ${folderName}</div>`;
                    el.folders.appendChild(box);
                }

                const depth = depthMap[dir] || 1;
                box.style.left = `${bounds.minX - pad}px`;
                box.style.top = `${bounds.minY - topPad}px`;
                box.style.width = `${bounds.maxX - bounds.minX + pad * 2}px`;
                box.style.height = `${bounds.maxY - bounds.minY + pad + topPad}px`;
                // Child folders (deeper) render above parents
                box.style.zIndex = depth + 1;
            });
        }

        // ================================================================
        //  CANVAS TRANSFORM
        // ================================================================
        function updateCanvasTransform() {
            el.canvas.style.transform =
                `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;
            el.workspace.style.backgroundPosition =
                `${state.pan.x * 0.5}px ${state.pan.y * 0.5}px`;
        }

        // ================================================================
        //  INTERACTIONS: PAN, ZOOM, DRAG NODE
        // ================================================================
        el.workspace.addEventListener('mousedown', (e) => {
            if (e.target.closest('.node')) return;
            state.isDraggingCanvas = true;
            state.lastMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => {
            state.isDraggingCanvas = false;
            state.draggedNode = null;
        });

        window.addEventListener('mousemove', (e) => {
            const dx = e.clientX - state.lastMouse.x;
            const dy = e.clientY - state.lastMouse.y;

            if (state.isDraggingCanvas) {
                state.pan.x += dx;
                state.pan.y += dy;
                updateCanvasTransform();
            } else if (state.draggedNode) {
                const id = state.draggedNode;
                const node = state.nodes[id];
                if (!node) return;
                node.x += dx / state.zoom;
                node.y += dy / state.zoom;
                const elNode = document.getElementById(`node-${id}`);
                if (elNode) {
                    elNode.style.left = `${node.x}px`;
                    elNode.style.top = `${node.y}px`;
                }
                updateAllVisuals();
            }
            state.lastMouse = { x: e.clientX, y: e.clientY };
        });

        el.workspace.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const rect = el.workspace.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            state.pan.x = mx - (mx - state.pan.x) * delta;
            state.pan.y = my - (my - state.pan.y) * delta;
            state.zoom *= delta;
            state.zoom = Math.max(0.15, Math.min(state.zoom, 2.5));
            updateCanvasTransform();
        }, { passive: false });

        window.startNodeDrag = function(e, id) {
            if (e.target.closest('.node-toggle') || e.target.closest('.btn-delete')) return;
            state.draggedNode = id;
            state.lastMouse = { x: e.clientX, y: e.clientY };
            const elNode = document.getElementById(`node-${id}`);
            if (elNode) el.nodes.appendChild(elNode);
        };

        window.addEventListener('resize', updateAllVisuals);

        // ================================================================
        //  INDEXEDDB SESSION MANAGEMENT
        // ================================================================
        function serializeState() {
            const nodesData = {};
            Object.keys(state.nodes).forEach(key => {
                const n = state.nodes[key];
                nodesData[key] = {
                    id: n.id,
                    type: n.type,
                    iconText: n.iconText,
                    vars: n.vars,
                    deps: n.deps,
                    dirPath: n.dirPath,
                    x: n.x,
                    y: n.y,
                    expanded: n.expanded
                };
            });
            return {
                projectName: state.currentProject,
                nodes: nodesData,
                edges: state.edges,
                structuralEdges: state.structuralEdges,
                inferredPaths: state.inferredPaths,
                pan: state.pan,
                zoom: state.zoom,
                filesProcessed: state.filesProcessed,
            };
        }

        function deserializeState(data) {
            state.nodes = {};
            state.edges = [];
            state.structuralEdges = [];
            state.inferredPaths = {};
            state.filesProcessed = 0;
            state.processedFiles = new Set();
            state.currentProject = data.projectName || 'Untitled';
            
            document.getElementById('currentProjectTag').innerHTML = `<i class="fa-solid fa-diagram-project"></i> ${state.currentProject}`;

            Object.keys(data.nodes).forEach(key => {
                const n = data.nodes[key];
                state.nodes[key] = n;
                state.processedFiles.add(key);
            });

            state.edges = data.edges || [];
            state.structuralEdges = data.structuralEdges || [];
            state.inferredPaths = data.inferredPaths || {};
            state.pan = data.pan || { x: 0, y: 0 };
            state.zoom = data.zoom || 1;
            state.filesProcessed = data.filesProcessed || 0;

            rebuildUI();
            updateCanvasTransform();
            updateAllVisuals();
            el.fileCount.innerText = state.filesProcessed;
            showToast(`📂 Project restored (${state.filesProcessed} files)`);
        }

        function rebuildUI() {
            el.nodes.innerHTML = '';
            el.fileList.innerHTML = '';
            el.folders.innerHTML = '';
            el.edges.innerHTML = '';

            Object.keys(state.nodes).forEach(key => {
                const n = state.nodes[key];
                const nodeEl = createNodeElement(n);
                el.nodes.appendChild(nodeEl);
            });

            Object.keys(state.nodes).forEach(key => {
                const n = state.nodes[key];
                if (n.type !== 'db' && n.type !== 'db-cloud') {
                    const size = 1024;
                    addFileToTray(n.id, n.iconText || 'Js', size);
                }
            });

            updateAllVisuals();
        }
        
        // Modal helpers
        window.openModal = function(id) {
            document.getElementById(id).style.display = 'flex';
        }
        window.closeModal = function(id) {
            document.getElementById(id).style.display = 'none';
        }

        el.saveSessionBtn.addEventListener('click', () => {
            document.getElementById('saveProjectName').value = state.currentProject === 'Untitled' ? '' : state.currentProject;
            openModal('saveModal');
        });
        
        document.getElementById('confirmSaveBtn').addEventListener('click', async () => {
            const name = document.getElementById('saveProjectName').value.trim() || 'Untitled';
            state.currentProject = name;
            document.getElementById('currentProjectTag').innerHTML = `<i class="fa-solid fa-diagram-project"></i> ${name}`;
            
            const data = serializeState();
            const success = await saveProject(name, data);
            if(success) showToast(`💾 Project '${name}' saved`);
            else showToast(`❌ Failed to save project`);
            closeModal('saveModal');
        });

        el.loadSessionBtn.addEventListener('click', async () => {
            const projects = await getAllProjects();
            const listEl = document.getElementById('projectList');
            listEl.innerHTML = '';
            
            if(projects.length === 0) {
                listEl.innerHTML = '<p style="color:var(--text-muted); font-size:13px; text-align:center;">No saved projects found.</p>';
            } else {
                projects.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'project-list-item';
                    div.innerHTML = `
                        <span class="project-name"><i class="fa-solid fa-folder"></i> ${p}</span>
                        <div>
                            <button class="mode-btn active load-btn" style="padding:4px 10px; font-size:11px;">Load</button>
                            <button class="mode-btn delete-btn" style="padding:4px 10px; font-size:11px; background:rgba(246, 34, 23, 0.2); color:var(--text-ruby);">Delete</button>
                        </div>
                    `;
                    div.querySelector('.load-btn').onclick = async () => {
                        const data = await loadProject(p);
                        if(data) {
                            el.nodes.innerHTML = ''; el.folders.innerHTML = ''; el.edges.innerHTML = ''; el.fileList.innerHTML = '';
                            deserializeState(data);
                        }
                        closeModal('loadModal');
                    };
                    div.querySelector('.delete-btn').onclick = async (e) => {
                        e.stopPropagation();
                        await deleteProjectFromDB(p);
                        div.remove();
                        if(listEl.children.length === 0) {
                            listEl.innerHTML = '<p style="color:var(--text-muted); font-size:13px; text-align:center;">No saved projects found.</p>';
                        }
                    };
                    listEl.appendChild(div);
                });
            }
            openModal('loadModal');
        });

        el.clearSessionBtn.addEventListener('click', () => {
            openModal('confirmModal');
        });
        
        document.getElementById('confirmClearBtn').addEventListener('click', () => {
            state.currentProject = 'Untitled';
            document.getElementById('currentProjectTag').innerHTML = `<i class="fa-solid fa-diagram-project"></i> Untitled`;
            state.nodes = {}; state.edges = []; state.structuralEdges = []; state.inferredPaths = {};
            state.filesProcessed = 0; state.processedFiles = new Set();
            el.nodes.innerHTML = ''; el.folders.innerHTML = ''; el.edges.innerHTML = ''; el.fileList.innerHTML = '';
            el.fileCount.innerText = '0';
            updateAllVisuals();
            showToast('🧹 Workspace cleared');
            closeModal('confirmModal');
        });

        // Auto-save
        let saveTimeout = null;

        function autoSave() {
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                if (state.currentProject === 'Untitled') return; // Only autosave explicitly saved/loaded projects
                const data = serializeState();
                saveProject(state.currentProject, data);
            }, 3000);
        }

        const origAddNode = addNodeData;
        addNodeData = function(id, type, iconText, vars, deps, dirPath) {
            origAddNode(id, type, iconText, vars, deps, dirPath);
            autoSave();
        };

        const origRemoveScript = window.removeScript;
        window.removeScript = function(name, event) {
            origRemoveScript(name, event);
            autoSave();
        };

        const origToggleNode = window.toggleNode;
        window.toggleNode = function(id, event) {
            origToggleNode(id, event);
            autoSave();
        };

        window.addEventListener('mouseup', () => {
            if (state.draggedNode) {
                autoSave();
            }
        });

        // ================================================================
        //  INIT
        // ================================================================
        initDragAndDrop();
        setPickMode('files');
        loadPlugins(); // Trigger extension loader

        (async function init() {
            state.pan.x = 100;
            state.pan.y = 100;
            updateCanvasTransform();

            const projects = await getAllProjects();
            if (projects.length > 0) {
                showToast(`🗃️ ${projects.length} saved projects available. Click Load to open one.`);
            } else {
                showToast('🕸️ Drop scripts or folders to build the matrix.');
            }
        })();

        window.__state = state;
    </script>

</body>
</html>
