<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Occam's Web | Premium Dependency Matrix</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* ----- ROOT VARIABLES ----- */
        :root {
            --bg-midnight: #0a0a1a;
            --bg-russian: #020205;
            --accent-orange: #FF8C00;
            --accent-orange-glow: rgba(255, 140, 0, 0.4);
            --text-ruby: #F62217;
            --text-ruby-glow: rgba(246, 34, 23, 0.6);
            --text-light: #f0f0f5;
            --text-muted: #8b8b9e;
            --glass-bg: rgba(10, 10, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            --font-tech: 'Share Tech Mono', monospace;
            --font-header: 'Rajdhani', sans-serif;
        }

        /* ----- RESET ----- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        /* ----- BODY ----- */
        body {
            font-family: var(--font-tech);
            background: radial-gradient(circle at 50% 0%, #1a1a3a 0%, var(--bg-russian) 100%);
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-orange-glow);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-orange);
        }

        /* ----- SIDEBAR ----- */
        #sidebar {
            width: 380px;
            background: var(--glass-bg);
            border-right: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            z-index: 20;
            position: relative;
            flex-shrink: 0;
        }

        .brand {
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, transparent 100%);
            border-bottom: 1px solid var(--glass-border);
        }

        .brand h1 {
            font-family: var(--font-header);
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px var(--text-ruby-glow), 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .brand h1 span {
            color: var(--text-ruby);
        }
        .brand p {
            font-family: var(--font-header);
            font-size: 14px;
            color: var(--accent-orange);
            margin-top: 8px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* ----- DROP ZONE ----- */
        .drop-zone-container {
            padding: 20px;
        }

        #drop-zone {
            border: 2px dashed rgba(255, 140, 0, 0.3);
            border-radius: 12px;
            padding: 24px 20px 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        #drop-zone:hover,
        #drop-zone.dragover {
            border-color: var(--accent-orange);
            background: rgba(255, 140, 0, 0.05);
            box-shadow: 0 0 20px var(--accent-orange-glow) inset;
        }

        #drop-zone i.fa-cloud-arrow-up {
            font-size: 32px;
            color: var(--accent-orange);
            margin-bottom: 10px;
            filter: drop-shadow(0 0 8px var(--accent-orange-glow));
        }

        #drop-zone p {
            font-family: var(--font-header);
            font-size: 16px;
            color: var(--text-light);
            pointer-events: none;
            margin-bottom: 6px;
        }

        /* ----- MODE TOGGLE ----- */
        .mode-toggle {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 4px;
            margin: 6px 0 10px;
            pointer-events: auto;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .mode-toggle .mode-btn {
            padding: 6px 18px;
            font-family: var(--font-header);
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
        }

        .mode-toggle .mode-btn.active {
            background: var(--accent-orange);
            color: #000;
            box-shadow: 0 0 20px var(--accent-orange-glow);
        }

        .mode-toggle .mode-btn:not(.active):hover {
            color: #fff;
        }

        #drop-zone .browse-links {
            font-size: 13px;
            color: var(--text-muted);
            pointer-events: auto;
            margin-top: 4px;
        }

        #drop-zone .browse-links span {
            color: var(--accent-orange);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        #drop-zone .browse-links span:hover {
            color: #fff;
            text-shadow: 0 0 5px var(--accent-orange-glow);
        }

        #file-input,
        #folder-input {
            display: none;
        }

        /* ----- FILE TRAY ----- */
        .file-tray-header {
            padding: 0 20px 10px;
            font-family: var(--font-header);
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tray-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .tray-actions .btn-icon {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 4px 6px;
            border-radius: 4px;
        }

        .tray-actions .btn-icon:hover {
            color: var(--accent-orange);
            background: rgba(255, 140, 0, 0.1);
        }

        .tray-actions .btn-icon.danger:hover {
            color: var(--text-ruby);
            background: rgba(246, 34, 23, 0.1);
        }

        #file-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0 10px 20px;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-orange-glow);
            transform: translateX(4px);
        }

        .file-item .doc-icon-wrapper {
            position: relative;
            width: 28px;
            height: 36px;
            margin-right: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .file-item .doc-icon-bg {
            position: absolute;
            font-size: 32px;
            color: rgba(255, 255, 255, 0.08);
        }

        .file-item .doc-icon-text {
            position: absolute;
            font-family: var(--font-header);
            font-weight: 700;
            font-size: 10px;
            color: var(--accent-orange);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
        }

        .file-item .file-info {
            flex: 1;
            overflow: hidden;
            min-width: 0;
        }

        .file-item .file-name {
            font-family: var(--font-header);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item .file-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .path-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            color: var(--accent-orange);
            font-family: var(--font-tech);
            font-size: 10px;
            width: 75px;
            padding: 2px 4px;
            border-radius: 3px;
            outline: none;
            transition: all 0.2s ease;
            margin-left: 4px;
        }

        .path-input:focus {
            border-color: var(--accent-orange);
            background: rgba(0,0,0,0.3);
            width: 140px;
        }

        .path-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-style: italic;
        }

        .file-item .file-actions {
            margin-left: 8px;
            flex-shrink: 0;
        }

        .file-item .btn-delete {
            color: var(--text-muted);
            background: none;
            border: none;
            font-size: 13px;
            cursor: pointer;
            padding: 4px;
            transition: all 0.2s ease;
        }

        .file-item .btn-delete:hover {
            color: var(--text-ruby);
            filter: drop-shadow(0 0 5px var(--text-ruby-glow));
        }

        /* ----- WORKSPACE ----- */
        #workspace {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-image:
                linear-gradient(rgba(255, 140, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 140, 0, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0;
            cursor: grab;
        }

        #workspace::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(2, 2, 5, 0.6) 100%);
            pointer-events: none;
            z-index: 10;
        }

        #workspace:active {
            cursor: grabbing;
        }

        /* ----- CANVAS ----- */
        #canvas {
            position: absolute;
            inset: 0;
            transform-origin: 0 0;
        }

        #folders {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        #edges {
            position: absolute;
            inset: 0;
            overflow: visible;
            pointer-events: none;
            z-index: 2;
        }

        #nodes {
            position: absolute;
            inset: 0;
            z-index: 3;
        }

        /* ----- FOLDER BOX (AABB) ----- */
        .folder-box {
            position: absolute;
            background: rgba(255, 140, 0, 0.03);
            border: 1px dashed rgba(255, 140, 0, 0.15);
            border-radius: 12px;
            pointer-events: none;
            transition: left 0.1s ease, top 0.1s ease, width 0.1s ease, height 0.1s ease;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 140, 0, 0.05);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .folder-box .folder-label {
            position: absolute;
            top: 6px;
            left: 10px;
            font-family: var(--font-header);
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 140, 0, 0.85);
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
            letter-spacing: 1px;
        }

        .folder-box .folder-label i {
            color: rgba(255, 140, 0, 0.7);
        }

        /* ----- NODE ----- */
        .node {
            position: absolute;
            width: 260px;
            background: linear-gradient(135deg, rgba(20, 20, 35, 0.88) 0%, rgba(10, 10, 20, 0.96) 100%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: box-shadow 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .node:hover {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9), 0 0 20px var(--text-ruby-glow);
            border-color: rgba(246, 34, 23, 0.5);
            z-index: 100;
        }

        .node-header {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 140, 0, 0.12);
            border-radius: 12px 12px 0 0;
            position: relative;
            overflow: hidden;
            gap: 8px;
        }

        /* Node type accent lines */
        .node[data-type="js"] {
            border-top-color: #f7df1e;
        }
        .node[data-type="ts"] {
            border-top-color: #3178c6;
        }
        .node[data-type="cs"] {
            border-top-color: #239120;
        }
        .node[data-type="cpp"] {
            border-top-color: #00599C;
        }
        .node[data-type="py"] {
            border-top-color: #3776ab;
        }
        .node[data-type="rb"] {
            border-top-color: #cc342d;
        }
        .node[data-type="php"] {
            border-top-color: #777bb4;
        }
        .node[data-type="html"] {
            border-top-color: #e34f26;
        }
        .node[data-type="css"] {
            border-top-color: #1572B6;
        }

        /* ----- DB NODE (pure icon) ----- */
        .node.db-node {
            width: auto;
            background: transparent;
            border: none;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        .node.db-node:hover {
            box-shadow: none;
        }
        .node.db-node .db-icon {
            font-size: 64px;
            color: var(--accent-orange);
            filter: drop-shadow(0 0 15px var(--accent-orange-glow));
            margin-bottom: 6px;
            transition: all 0.3s ease;
        }
        .node.db-node:hover .db-icon {
            color: #fff;
            filter: drop-shadow(0 0 20px var(--accent-orange));
            transform: scale(1.05);
        }
        .node.db-node .db-title {
            font-family: var(--font-header);
            font-weight: 700;
            font-size: 13px;
            color: var(--text-light);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            background: rgba(5, 5, 10, 0.85);
            padding: 5px 14px;
            border-radius: 6px;
            border: 1px solid var(--accent-orange-glow);
            white-space: nowrap;
        }

        /* Cloud Badge for External DBs */
        .cloud-badge {
            position: absolute;
            bottom: -2px;
            right: -8px;
            color: #00d2ff;
            font-size: 24px;
            filter: drop-shadow(0 0 8px #00d2ff);
            background: var(--bg-russian);
            border-radius: 50%;
            padding: 2px;
            z-index: 2;
        }

        /* ----- NODE TITLE & FOLDER BADGE ----- */
        .node-title {
            font-family: var(--font-header);
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            min-width: 0;
        }

        .node-folder-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: var(--font-header);
            font-size: 10px;
            font-weight: 600;
            color: var(--accent-orange);
            background: rgba(255, 140, 0, 0.12);
            padding: 2px 8px 2px 6px;
            border-radius: 12px;
            border: 1px solid rgba(255, 140, 0, 0.15);
            white-space: nowrap;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
            cursor: default;
            transition: all 0.2s ease;
        }

        .node-folder-badge i {
            font-size: 10px;
            color: var(--accent-orange);
        }

        .node-folder-badge:hover {
            background: rgba(255, 140, 0, 0.2);
            border-color: var(--accent-orange);
        }

        /* Folder color accent strip on node */
        .node-folder-accent {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 12px 12px 0 0;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .node:hover .node-folder-accent {
            opacity: 1;
        }

        .node-toggle {
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }
        .node-toggle:hover {
            color: var(--accent-orange);
            background: rgba(255, 140, 0, 0.1);
        }
        .node.expanded .node-toggle {
            transform: rotate(180deg);
        }

        .node-content {
            display: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .node.expanded .node-content {
            display: block;
        }

        .variable-list {
            list-style: none;
            padding: 8px 14px;
        }
        .variable-item {
            padding: 4px 0;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 11px;
            color: var(--text-light);
            font-family: var(--font-tech);
        }
        .variable-item:last-child {
            border-bottom: none;
        }
        .variable-item i {
            color: var(--text-ruby);
            margin-right: 6px;
            font-size: 9px;
            opacity: 0.8;
        }

        /* ----- EDGES (SVG) ----- */
        .edge-glow {
            stroke: var(--text-ruby);
            stroke-width: 8;
            fill: none;
            opacity: 0.1;
            filter: blur(4px);
        }
        .edge-line {
            stroke: rgba(255, 140, 0, 0.25);
            stroke-width: 1.5;
            fill: none;
            transition: stroke 0.3s ease;
        }
        .edge-packet {
            stroke: var(--text-ruby);
            stroke-width: 2.5;
            fill: none;
            stroke-dasharray: 4 20;
            stroke-linecap: round;
            animation: data-flow 1s linear infinite;
            filter: drop-shadow(0 0 4px var(--text-ruby));
        }

        /* --- STRUCTURAL EDGES (Asset loads, Electron bridging, safe config) --- */
        .edge-line.structural {
            stroke: rgba(0, 210, 255, 0.3);
            stroke-dasharray: 6 6;
        }
        .edge-packet.structural {
            stroke: #00d2ff;
            filter: drop-shadow(0 0 5px #00d2ff);
            opacity: 0.85;
        }

        @keyframes data-flow {
            from {
                stroke-dashoffset: 24;
            }
            to {
                stroke-dashoffset: 0;
            }
        }

        /* --- PLUGIN STYLES --- */
        .edge-glow.cycle-warning {
            stroke: #ff0000;
            filter: drop-shadow(0 0 8px #ff0000);
            opacity: 0.6;
        }
        .edge-packet.cycle-warning {
            stroke: #ff0000;
            filter: drop-shadow(0 0 6px #ff0000);
        }

        /* ----- TOASTS ----- */
        .notification-area {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 100;
        }

        .toast {
            background: rgba(20, 20, 30, 0.92);
            border-left: 3px solid var(--accent-orange);
            color: var(--text-light);
            padding: 14px 20px;
            border-radius: 4px;
            font-family: var(--font-header);
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 140, 0, 0.1);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* ----- MODAL SYSTEM ----- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: linear-gradient(135deg, rgba(20, 20, 35, 0.95) 0%, rgba(10, 10, 20, 0.98) 100%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 140, 0, 0.3);
            border-radius: 12px;
            padding: 24px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), 0 0 20px rgba(255, 140, 0, 0.1);
        }
        .modal h3 {
            font-family: var(--font-header);
            color: #fff;
            margin-bottom: 16px;
            font-size: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }
        .modal p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .modal-input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            padding: 12px;
            border-radius: 6px;
            font-family: var(--font-tech);
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .modal-input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 10px var(--accent-orange-glow);
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .project-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .project-list-item {
            display: flex;
